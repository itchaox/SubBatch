<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Lark Sidebar Plugin Helper</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f7f8f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .input-container {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        transition: box-shadow 0.3s ease;
      }

      .input-container:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        padding-right: 1px;
      }

      .input-label {
        display: block;
        color: #333;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        min-width: 80px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        flex: 1;
      }

      .input-field {
        width: 100%;
        padding: 10px 32px 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        color: #333;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }

      .input-field:focus {
        outline: none;
        border-color: #3370ff;
        box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.1);
      }

      .input-field::placeholder {
        color: #999;
      }

      .clear-btn {
        position: absolute;
        right: 8px;
        background: none;
        border: none;
        padding: 4px;
        cursor: pointer;
        color: #999;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0.7;
        transition: opacity 0.3s;
      }

      .input-field:focus + .clear-btn,
      .input-wrapper:hover .clear-btn {
        display: flex;
      }

      .clear-btn:hover {
        opacity: 1;
      }

      .clear-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .get-url-btn {
        width: 100%;
        max-width: 400px;
        margin-bottom: 16px;
        padding: 10px 20px;
        background-color: #3370ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(51, 112, 255, 0.2);
      }

      .get-url-btn:hover {
        background-color: #2860e1;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(51, 112, 255, 0.3);
      }

      .get-url-btn:active {
        transform: translateY(1px);
      }

      .get-url-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .button-group {
        margin-top: 12px;
        display: flex;
        gap: 12px;
      }

      .action-btn {
        flex: 1;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .primary-btn {
        background-color: #3370ff;
        color: white;
        box-shadow: 0 2px 8px rgba(51, 112, 255, 0.2);
      }

      .primary-btn:hover {
        background-color: #2860e1;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(51, 112, 255, 0.3);
      }

      .secondary-btn {
        background-color: #f0f2f5;
        color: #333;
      }

      .secondary-btn:hover {
        background-color: #e4e6e8;
        transform: translateY(-1px);
      }

      .action-btn:active {
        transform: translateY(1px);
      }

      .action-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .action-btn.hidden {
        display: none;
      }

      .preview-copy-group {
        display: none;
      }

      .preview-copy-group.show {
        display: flex;
      }

      .sponsor-container {
        width: 100%;
        max-width: 400px;
        margin-bottom: 12px;
        display: flex;
        gap: 12px;
      }

      .sponsor-btn {
        flex: 2.5;
        padding: 8px 16px;
        background: linear-gradient(to right, #ffd75e, #ffcd38);
        color: #333;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(255, 215, 94, 0.3);
        transform-origin: center;
      }

      .sponsor-btn:hover {
        background: linear-gradient(to right, #ffcd38, #ffc107);
        transform: scale(1.06);
        box-shadow: 0 4px 12px rgba(255, 215, 94, 0.4);
      }

      .sponsor-btn:active {
        transform: scale(1.1) translateY(1px);
        box-shadow: 0 2px 4px rgba(255, 215, 94, 0.2);
      }

      .follow-btn {
        flex: 1;
        padding: 8px 16px;
        background: linear-gradient(to right, #ff7eb3, #ff4d9c);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(255, 77, 156, 0.3);
      }

      .follow-btn:hover {
        background: linear-gradient(to right, #ff4d9c, #ff1a87);
        transform: scale(1.06);
        box-shadow: 0 4px 12px rgba(255, 77, 156, 0.4);
      }

      .follow-btn:active {
        transform: scale(1.1) translateY(1px);
      }

      .sponsor-btn svg,
      .follow-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .error-toast,
      .success-toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background-color: #fff;
        color: #333;
        padding: 12px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: transform 0.3s ease;
        z-index: 1000;
        min-width: 280px;
        max-width: 400px;
      }

      .error-toast.show,
      .success-toast.show {
        transform: translateX(-50%) translateY(0);
      }

      .error-toast-icon {
        color: #ff4d4f;
        width: 24px;
        height: 24px;
        min-width: 24px;
      }

      .success-toast-icon {
        color: #52c41a;
        width: 24px;
        height: 24px;
        min-width: 24px;
      }

      .error-toast-message,
      .success-toast-message {
        flex: 1;
        font-size: 14px;
      }

      .error-toast-close,
      .success-toast-close {
        background: none;
        border: none;
        cursor: pointer;
        color: #999;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .error-toast-close:hover,
      .success-toast-close:hover {
        color: #666;
      }

      .error-toast-close svg,
      .success-toast-close svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .section-divider {
        width: 100%;
        height: 1px;
        background-color: #eee;
        margin: 16px 0;
      }

      /* 视频标题区域样式 */
      .video-title-container {
        margin-top: 16px;
        padding: 12px;
        background-color: #f8f9fa;
        border-radius: 8px;
        width: 100%;
      }

      .video-title-header {
        font-size: 14px;
        font-weight: 500;
        color: #666;
        margin-bottom: 8px;
      }

      .video-title {
        font-size: 14px;
        color: #333;
        word-break: break-word;
        line-height: 1.5;
        padding: 8px 10px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e8e8e8;
      }

      .video-info-container {
        margin-top: 8px;
        padding: 8px;
        background-color: #f0f0f0;
        border-radius: 6px;
      }

      .video-info-row {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }

      .video-info-label {
        font-weight: 500;
        margin-right: 8px;
      }

      .video-info-value {
        color: #666;
      }

      /* 获取字幕按钮 */
      .get-subtitle-btn {
        margin-top: 10px;
        padding: 6px 12px;
        background-color: #3370ff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .get-subtitle-btn:hover {
        background-color: #2860e1;
      }

      /* 字幕区域样式 */
      .subtitle-container {
        margin-top: 16px;
        padding: 12px;
        background-color: #f8f9fa;
        border-radius: 8px;
        width: 100%;
      }

      .subtitle-header {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 500;
        color: #666;
        margin-bottom: 8px;
      }

      .subtitle-status {
        font-size: 12px;
        color: #888;
      }

      .subtitle-content {
        max-height: 200px;
        overflow-y: auto;
        padding: 10px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e8e8e8;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .subtitle-actions {
        margin-top: 10px;
        display: flex;
        justify-content: flex-end;
      }

      /* 无字幕选项样式 */
      .no-subtitle-options {
        margin-top: 16px;
        padding: 12px;
        background-color: #f8f8f8;
        border: 1px dashed #ddd;
        border-radius: 6px;
      }

      .no-subtitle-tip {
        font-size: 13px;
        color: #666;
        margin-bottom: 12px;
      }

      .no-subtitle-actions {
        display: flex;
        gap: 8px;
      }

      .no-subtitle-actions .action-btn {
        font-size: 13px;
        padding: 8px 12px;
      }

      @media (max-width: 480px) {
        .sponsor-container {
          flex-direction: column;
        }

        .sponsor-btn,
        .follow-btn {
          width: 100%;
        }
      }

      /* Cookie操作按钮的样式 */
      .cookie-action-btn-container {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        gap: 10px;
      }

      .cookie-action-btn {
        padding: 6px 12px;
        background-color: #3370ff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: all 0.3s ease;
      }

      .cookie-action-btn:hover {
        background-color: #2860e1;
      }

      .cookie-action-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .cookie-tip {
        font-size: 12px;
        color: #666;
        flex: 1;
      }

      /* 批量视频表格样式 */
      .video-table-container {
        margin-top: 20px;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .table-header h3 {
        font-size: 18px;
        font-weight: 500;
      }

      .table-actions {
        display: flex;
        gap: 12px;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }

      th {
        background-color: #f8f9fa;
      }

      tbody tr:hover {
        background-color: #f0f2f5;
      }

      /* 表格行按钮样式 */
      .table-action-btn {
        padding: 4px 8px;
        font-size: 12px;
        margin-right: 6px;
        background-color: #f0f2f5;
        color: #333;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .table-action-btn:hover {
        background-color: #e4e6e8;
      }

      .get-subtitle-row-btn {
        background-color: #3370ff;
        color: white;
      }

      .get-subtitle-row-btn:hover {
        background-color: #2860e1;
      }

      .remove-row-btn {
        background-color: #ff4d4f;
        color: white;
      }

      .remove-row-btn:hover {
        background-color: #f5222d;
      }
    </style>
  </head>
  <body>
    <div class="sponsor-container">
      <button
        id="sponsorBtn"
        class="sponsor-btn"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
        赞助我
      </button>
      <button
        id="followBtn"
        class="follow-btn"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-6h10v2H7zm3-7c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"
          />
        </svg>
        关注我
      </button>
    </div>
    <button class="get-url-btn">
      <svg viewBox="0 0 24 24">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
      </svg>
      获取当前页面地址
    </button>
    <div class="input-container">
      <div class="input-row">
        <label class="input-label">Cookie：</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="bilibiliCookie"
            class="input-field"
            placeholder="请输入Bilibili的Cookie"
          />
          <button class="clear-btn cookie-clear-btn">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- 添加Cookie操作按钮 -->
      <div class="cookie-action-btn-container">
        <button
          id="applyCookieBtn"
          class="cookie-action-btn"
        >
          <svg viewBox="0 0 24 24">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" />
          </svg>
          应用Cookie
        </button>
        <span class="cookie-tip">在每次请求前Cookie会自动应用</span>
      </div>

      <!-- 视频地址输入框 -->
      <div class="input-group">
        <div class="input-label">视频地址</div>
        <div class="input-container">
          <input
            id="tableUrlInput"
            type="text"
            placeholder="输入B站视频地址"
          />
          <div class="button-group">
            <button
              id="generateUrlBtn"
              class="action-btn primary-btn"
            >
              <svg viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
              添加到表格
            </button>
          </div>
        </div>
      </div>

      <!-- 视频标题显示区域 -->
      <div
        id="videoTitleContainer"
        class="video-title-container"
      >
        <div class="video-title-header">视频信息：</div>
        <div
          id="videoTitle"
          class="video-title"
        >
          尚未获取视频信息
        </div>
        <div
          id="videoInfoContainer"
          class="video-info-container"
          style="display: none"
        >
          <div class="video-info-row">
            <span class="video-info-label">作者：</span>
            <span
              id="videoAuthor"
              class="video-info-value"
              >未知</span
            >
          </div>
          <div class="video-info-row">
            <span class="video-info-label">播放量：</span>
            <span
              id="videoViewCount"
              class="video-info-value"
              >0</span
            >
          </div>
          <div class="video-info-row">
            <span class="video-info-label">点赞数：</span>
            <span
              id="videoLikeCount"
              class="video-info-value"
              >0</span
            >
          </div>
          <button
            id="getSubtitleBtn"
            class="get-subtitle-btn"
          >
            获取字幕
          </button>
        </div>
      </div>

      <!-- 字幕显示区域 -->
      <div
        id="subtitleContainer"
        class="subtitle-container"
        style="display: none"
      >
        <div class="subtitle-header">
          <span>字幕内容：</span>
          <span
            id="subtitleStatus"
            class="subtitle-status"
          ></span>
        </div>
        <div
          id="subtitleContent"
          class="subtitle-content"
        >
          尚未获取字幕
        </div>
        <div class="subtitle-actions">
          <button
            id="exportSubtitleBtn"
            class="action-btn primary-btn"
          >
            <svg viewBox="0 0 24 24">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
            </svg>
            导出字幕
          </button>
        </div>

        <!-- 无字幕时的处理选项 -->
        <div
          id="noSubtitleOptions"
          class="no-subtitle-options"
          style="display: none"
        >
          <div class="no-subtitle-tip">该视频没有可提取的外挂字幕，您可以：</div>
          <div class="no-subtitle-actions">
            <button
              id="downloadVideoBtn"
              class="action-btn secondary-btn"
            >
              <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
              </svg>
              下载视频
            </button>
            <button
              id="transcribeAudioBtn"
              class="action-btn secondary-btn"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"
                />
              </svg>
              音频转字幕
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 批量视频表格 -->
    <div
      id="videoTableContainer"
      class="video-table-container"
    >
      <div class="table-header">
        <h3>批量视频列表</h3>
        <div class="table-actions">
          <button
            id="batchGetSubtitleBtn"
            class="action-btn primary-btn"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M18 8h-2v3h-3v2h3v3h2v-3h3v-2h-3V8zM5 11a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5-9a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
              />
            </svg>
            批量获取字幕
          </button>
          <button
            id="exportTableBtn"
            class="action-btn secondary-btn"
          >
            <svg viewBox="0 0 24 24">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
            </svg>
            导出表格
          </button>
          <button
            id="clearTableBtn"
            class="action-btn secondary-btn"
          >
            <svg viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
            清空表格
          </button>
        </div>
      </div>
      <div class="table-container">
        <table id="videoTable">
          <thead>
            <tr>
              <th>序号</th>
              <th>视频标题</th>
              <th>作者</th>
              <th>字幕状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="videoTableBody">
            <!-- 表格内容将通过JavaScript动态添加 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Toast通知 -->
    <div
      id="errorToast"
      class="error-toast"
    >
      <svg
        class="error-toast-icon"
        viewBox="0 0 24 24"
      >
