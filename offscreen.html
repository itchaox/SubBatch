<!DOCTYPE html>
<html>
<head>
  <title>Offscreen Document</title>
</head>
<body>
  <script>
    // 监听来自 background script 的消息
    chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
      if (message.action === 'downloadAudio') {
        downloadAudio(message.audioUrl)
          .then(arrayBuffer => {
            chrome.runtime.sendMessage({
              action: 'offscreenDownloadComplete',
              arrayBuffer: Array.from(new Uint8Array(arrayBuffer)),
            });
          })
          .catch(error => {
            chrome.runtime.sendMessage({
              action: 'offscreenDownloadError',
              error: error.message || '下载失败',
            });
          });
        return true;
      }
    });

    /**
     * 下载音频文件
     * @param {string} audioUrl - 音频 URL
     * @returns {Promise<ArrayBuffer>}
     */
    async function downloadAudio(audioUrl) {
      console.log('Offscreen: 开始下载音频', audioUrl.substring(0, 80));

      // 发送进度消息
      chrome.runtime.sendMessage({
        action: 'offscreenDownloadProgress',
        progress: 10,
        message: '开始连接...',
      });

      const response = await fetch(audioUrl, {
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          'Referer': 'https://www.bilibili.com/',
        },
        credentials: 'omit',
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const contentLength = response.headers.get('Content-Length');
      const total = contentLength ? parseInt(contentLength) : 0;

      chrome.runtime.sendMessage({
        action: 'offscreenDownloadProgress',
        progress: 30,
        message: '正在下载...',
      });

      // 读取响应体
      const reader = response.body.getReader();
      const chunks = [];
      let receivedLength = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        receivedLength += value.length;

        if (total > 0) {
          const progress = 30 + (receivedLength / total) * 50;
          chrome.runtime.sendMessage({
            action: 'offscreenDownloadProgress',
            progress: Math.round(progress),
            message: `下载中 ${Math.round((receivedLength / 1024 / 1024) * 10) / 10} MB`,
          });
        }
      }

      chrome.runtime.sendMessage({
        action: 'offscreenDownloadProgress',
        progress: 85,
        message: '合并数据...',
      });

      // 合并所有 chunks
      const arrayBuffer = new Uint8Array(receivedLength);
      let position = 0;
      for (const chunk of chunks) {
        arrayBuffer.set(chunk, position);
        position += chunk.length;
      }

      console.log('Offscreen: 下载完成, 大小:', arrayBuffer.length);
      return arrayBuffer.buffer;
    }

    console.log('Offscreen document 已加载');
  </script>
</body>
</html>
